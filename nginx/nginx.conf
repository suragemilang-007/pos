# ============================================================
# nginx.conf — Reverse Proxy untuk POS Toko Melati
# ============================================================

# Upstream: Laravel PHP-FPM
upstream laravel_fpm {
    server laravel:9000;
}

server {
    listen 80;
    server_name localhost;

    # Root ke folder public Laravel
    root /var/www/html/public;
    index index.php index.html;

    # ── Keamanan Dasar ────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Sembunyikan versi nginx dari response header
    server_tokens off;

    # ── Static Files ─────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── WebSocket Proxy ke Node.js ────────────────────────────
    # Browser connect ke ws://localhost/ws
    # Nginx forward ke kafka-service:3001
    location /ws {
        proxy_pass http://kafka-service:3001;
        proxy_http_version 1.1;

        # Header wajib untuk upgrade ke WebSocket protocol
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # WebSocket butuh timeout yang panjang (koneksi persisten)
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 60s;
    }

    # ── Laravel API & Blade ───────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM (Laravel) ─────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   laravel_fpm;
        fastcgi_index  index.php;

        # Path ke file PHP di dalam container laravel
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        # Timeout untuk request yang agak lama (generate laporan, export)
        fastcgi_read_timeout 120s;
    }

    # ── Blokir akses ke file sensitif ────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }
}
