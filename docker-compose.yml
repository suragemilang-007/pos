services:
  # ─────────────────────────────────────────────────────────────
  # NGINX — Reverse Proxy & Static File Server
  # Menangani: routing HTTP ke Laravel, WebSocket proxy ke Node.js
  # ─────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pos_nginx
    ports:
      - "80:80"
    volumes:
      - ./laravel-app:/var/www/html:ro # read-only: nginx hanya serve static
    depends_on:
      - laravel
      - kafka-service
    networks:
      - pos_network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # LARAVEL — Backend API + Blade UI
  # Port 9000 (PHP-FPM, internal only — diakses via nginx)
  # ─────────────────────────────────────────────────────────────
  laravel:
    build:
      context: ./laravel-app
      dockerfile: Dockerfile
    container_name: pos_laravel
    volumes:
      - ./laravel-app:/var/www/html
      - /var/www/html/vendor # exclude vendor dari bind mount
      - /var/www/html/node_modules
    environment:
      APP_NAME: "POS Toko Melati"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost

      # Database — WAJIB pakai nama service Docker, bukan localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pos_grosir
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Kafka Service (Node.js HTTP endpoint)
      KAFKA_PRODUCER_URL: http://kafka-service:3000

      # Batas waktu void transaksi dalam menit (VoidTransaksiService::checkVoidEligibility)
      VOID_TIME_LIMIT_MINUTES: 30

      # Notifikasi H-N sebelum jatuh tempo hutang dagang (PembayaranPembelianService)
      HUTANG_REMINDER_DAYS: 3

      # WebSocket (untuk referensi di frontend jika dibutuhkan)
      WEBSOCKET_URL: ws://localhost/ws

      # Cache & Session
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pos_network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # KAFKA SERVICE — Node.js Producer + Consumer + WebSocket Server
  # Port 3000: HTTP endpoint (menerima event dari Laravel)
  # Port 3001: WebSocket server (push ke browser, diproxy nginx)
  # ─────────────────────────────────────────────────────────────
  kafka-service:
    build:
      context: ./kafka-service
      dockerfile: Dockerfile
    container_name: pos_kafka_service
    ports:
      - "3001:3001" # expose untuk debug WebSocket langsung
    environment:
      NODE_ENV: production

      # Kafka Broker — WAJIB nama service Docker, bukan localhost
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: pos-grosir-client
      KAFKA_GROUP_TRANSACTION: pos-transaction-group
      KAFKA_GROUP_INVENTORY: pos-inventory-group
      KAFKA_TOPIC_TRANSACTION: transaction-events
      KAFKA_TOPIC_INVENTORY: inventory-updates

      # Database — WAJIB nama service Docker, bukan localhost
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pos_grosir
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Server ports
      PRODUCER_HTTP_PORT: 3000
      WS_PORT: 3001

    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - pos_network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # MYSQL 8 — Database Utama
  # ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: pos_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: pos_grosir
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d # SQL seed awal (jika ada)
    ports:
      - "3306:3306" # expose untuk DBeaver / TablePlus
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pos_network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # APACHE KAFKA — Message Broker (KRaft mode, tanpa Zookeeper)
  # ─────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: pos_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk # wajib untuk Confluent KRaft
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - pos_network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # KAFKA UI — Dashboard monitoring topic & message (Dev only)
  # Akses: http://localhost:8080
  # Aktifkan dengan: docker compose --profile dev up -d
  # ─────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pos_kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pos-grosir-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - pos_network
    profiles:
      - dev
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────
# VOLUMES — Persistent Data
# ─────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  kafka_data:
    driver: local

# ─────────────────────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────────────────────
networks:
  pos_network:
    driver: bridge
